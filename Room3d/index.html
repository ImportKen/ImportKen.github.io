<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room 3D Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        font-family: system-ui, sans-serif;
      }
      #info {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">Loading Room.glb…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
