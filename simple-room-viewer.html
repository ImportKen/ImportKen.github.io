<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Ken Room — 3D Viewer</title>
  <link rel="stylesheet" href="./simple-room-viewer.css" />
</head>
<body>
  <header id="page-header"><h1>Ken Room</h1><span>3D Viewer</span></header>
  <div id="app"></div>
  <div id="hint">Click object to select &middot; Drag to rotate &middot; Scroll to zoom</div>
  <div id="pick-info" class="hidden"></div>
  <div id="ui-panel">
    <div id="ui-head"><b>Controls</b><button id="uiCollapse" title="Collapse">–</button></div>
    <div id="ui-body">
      <button id="resetView">Reset view</button>
      <div class="ui-sec">Mood</div>
      <div class="ui-chips">
        <button data-preset="day" class="active">Day</button><button data-preset="sunset">Sunset</button><button data-preset="night">Night</button>
      </div>
      <div class="ui-sec">Scene</div>
      <label><input type="checkbox" id="uiRotate" /> Auto-rotate</label>
      <label><input type="checkbox" id="uiDemo" checked /> Demo objects</label>
      <label><input type="checkbox" id="uiMoon" checked /> Orbit moon</label>
      <div class="ui-sec">Light</div>
      <label>Sun <span id="uiSunVal">2.6</span><input type="range" id="uiSun" min="0" max="4" step="0.1" value="2.6" /></label>
      <label>Exposure <span id="uiExpVal">1.1</span><input type="range" id="uiExp" min="0.3" max="2" step="0.05" value="1.1" /></label>
      <label>Follow <span id="uiFollowVal">2.0</span><input type="range" id="uiFollow" min="0.5" max="6" step="0.1" value="2" /></label>
    </div>
  </div>
  <button id="uiFab" class="hidden" title="Open controls" aria-label="Open controls">⚙</button>
  <div id="loader" role="status">Loading FinalRoom.glb…</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./viewer/main.js"></script>
</body>
</html>
