<!DOCTYPE html>
<html>

<head>
    <title>GPU</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            65,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(2, 3, 2);
        camera.lookAt(0, 0, 0);


       

const axesHelper = new THREE.AxesHelper(5);
scene.add(axesHelper);




const plane_vertices = [
    -1,  -1,  0,
    1,  -1,  0,
    1,  1,  0,

    -1,  1,  0,
    -1,  -1,  0,
    1,  1,  0,

    -1, 1,   0,
     1, 1,  -1,
    -1, 1,  -1,
    
];

/* Auto-exported from Blender */
/* Auto-exported from Blender */
//x,y,z vertex
const vertices = [
  1.0, 0.0, 1.0,
  -1.0, 0.0, -1.0,
   -1.0, 0.0, 1.0,

   1.0, 0.0, 1.0, 
   1.0, 0.0, -1.0, 
   -1.0, 0.0, -1.0
];

const uvs = [
  1.0, 0.5, 0.5,
   1.0, 0.5, 0.5,
    1.0, 0.5, 1.0,
     1.0, 0.5, 1.0
];





let rotX = 0;

const angle = THREE.MathUtils.degToRad(rotX);
const cos = Math.cos(angle);
const sin = Math.sin(angle);

const rotationX90 = new THREE.Matrix4();
rotationX90.set(
1,   0,    0, 0,
0, cos, -sin, 0,
0, sin,  cos, 0,
0,   0,    0, 1
);


const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));   
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));  
        geometry.computeVertexNormals();

        const texture = new THREE.TextureLoader().load('https://sibsansuk.github.io/smile.png', t => {
        });
        const mat = new THREE.MeshStandardMaterial({
            map: texture
        });
        
        const myObj = new THREE.Mesh(geometry, mat);
        myObj.position.set(0, 0, 0);
        myObj.castShadow = true;
        scene.add(myObj);

 //Light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);

        // const loader = new THREE.OBJLoader();
        // loader.load("http://importken.github.io/SmallGuy.obj", function (obj) {
        //     obj.position.set(1, 0, 0);
        //     scene.add(obj);
        // });

        const controls = new THREE.OrbitControls(camera, renderer.domElement);



function animate(t) {

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate(0);



    </script>
</body>

</html>
